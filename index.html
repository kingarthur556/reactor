<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REACTOR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<meta property="og:title" content="REACTOR"><meta property="og:type" content="website">
<meta property="og:image" content="https://kingarthur556.github.io/reactor/reactor_preview.png"><meta property="og:url" content="https://kingarthur556.github.io/reactor/">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://kingarthur556.github.io/reactor/reactor_preview.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23050705'/%3E%3Cg fill='%23a8f21f'%3E%3Cpath id='a' d='M16.5 4.21A9 9 0 0 0 7.5 4.21L10.4 9.23A3.2 3.2 0 0 1 13.6 9.23Z'/%3E%3Cpath transform='rotate(120 12 12)' d='M16.5 4.21A9 9 0 0 0 7.5 4.21L10.4 9.23A3.2 3.2 0 0 1 13.6 9.23Z'/%3E%3Cpath transform='rotate(240 12 12)' d='M16.5 4.21A9 9 0 0 0 7.5 4.21L10.4 9.23A3.2 3.2 0 0 1 13.6 9.23Z'/%3E%3Ccircle cx='12' cy='12' r='1.7'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--lime:#a8f21f;--dim:#2c3d0c;--bg:#050705;--app:#080b06;--panel:#0b0f08;--field:#0e1409;--txt:#e9f5d0;--muted:#7d8a6a;--amber:#f2c230;--red:#ff3b30;--on:#050705}
body.super{--lime:#b980ff;--dim:#3b2260;--bg:#06040a;--app:#0a0710;--panel:#0d0914;--field:#130d1e;--txt:#f0e6ff;--muted:#8d7aa8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:14px;background:var(--bg);color:var(--txt);font-family:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace;transition:background .4s}
body.boot .app{visibility:hidden}
.app{position:relative;width:min(100%,960px);background:var(--app);border:1px solid var(--dim);border-radius:18px;padding:clamp(14px,2.4vw,24px);transition:border-color .2s,box-shadow .2s,background .4s}
.app.bad{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 40px #ff3b3055}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;letter-spacing:.3em;color:var(--lime)}
.sup{display:none;border:1px solid var(--lime);color:var(--lime);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.15em}
.right{display:flex;gap:10px;align-items:center}
.snd{width:38px;height:38px;border:1px solid var(--dim);background:var(--field);color:var(--lime);border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0}
.pts{border:1px solid var(--dim);border-radius:10px;padding:8px 14px;color:var(--muted);font-size:12px;letter-spacing:.1em}
.pts{display:flex;align-items:center;gap:8px}
.pts .bolt{filter:drop-shadow(0 0 5px #a8f21f);flex:none}
.pts strong{margin-left:0;font-size:18px;color:var(--lime);transition:color .2s}
.pts strong.loss{color:var(--red)}
.views{display:grid}
.view{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;visibility:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
.view.on{visibility:visible;pointer-events:auto;opacity:1}
.view>.layout,.view>.mk{width:100%}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
.dial{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
#needle{transition:transform 3.2s cubic-bezier(.12,.75,.12,1)}
.center{position:absolute;inset:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px}
.center .lbl{font-size:12px;letter-spacing:.2em;font-weight:800}
.center .val{font-size:clamp(22px,4.5vw,34px);font-weight:900}
.center .sub{font-size:10px;letter-spacing:.15em;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--dim);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;transition:background .4s}
.potbox{border:1px solid var(--dim);border-radius:10px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.potbox .pl{color:var(--muted);font-size:12px;letter-spacing:.2em}
.potbox .pv{font-size:24px;font-weight:900;color:var(--lime)}
.hint{width:100%;min-height:13px;font-size:10px;letter-spacing:.12em;color:var(--amber);text-align:right}
.odds{display:grid;gap:7px}
.odd{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--dim);border-radius:10px;padding:7px 14px;font-size:13px;letter-spacing:.08em}
.odd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:10px}
.odd b{font-size:17px}
input{min-width:0;width:100%;background:var(--field);border:1px solid var(--dim);border-radius:8px;padding:10px;color:var(--txt);font:inherit;font-size:15px}
input:focus{outline:1px solid var(--lime)}
#code{text-transform:uppercase;letter-spacing:.15em}
.go:disabled,.fix:disabled,.cash:disabled,#stake:disabled{opacity:.4;cursor:not-allowed}
.go{border:0;border-radius:10px;padding:13px;background:var(--lime);color:var(--on);font:inherit;font-size:18px;font-weight:900;letter-spacing:.2em;cursor:pointer}
.cash{border:1px solid var(--lime);background:transparent;color:var(--lime);border-radius:10px;padding:11px;font:inherit;font-size:15px;font-weight:900;letter-spacing:.12em;cursor:pointer}
.fix{border:1px solid var(--dim);background:transparent;color:var(--lime);border-radius:10px;padding:9px;font:inherit;font-weight:800;letter-spacing:.1em;cursor:pointer;width:100%}
.row{display:flex;gap:8px}
.ok{border:1px solid var(--dim);background:var(--field);color:var(--lime);border-radius:8px;padding:0 16px;font:inherit;font-weight:800;cursor:pointer}
.msg{min-height:14px;font-size:11px;letter-spacing:.1em;color:var(--lime)}
.msg.err{color:var(--red)}
.tabbar{display:flex;gap:5px;margin-top:14px;border-top:1px solid var(--dim);padding-top:12px}
.tabb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border:1px solid var(--dim);background:var(--field);color:var(--muted);border-radius:12px;font:inherit;font-size:9px;letter-spacing:.1em;cursor:pointer}
.tabb.on{color:var(--on);background:var(--lime);border-color:var(--lime)}
.tabb:disabled{opacity:.35;cursor:not-allowed}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{border:1px solid var(--dim);border-radius:14px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.art{height:230px;background:#030403;border:1px solid var(--dim);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.art svg,.art canvas{width:100%;height:100%;display:block}
.art canvas{cursor:grab;touch-action:none}
.nm{font-size:17px;font-weight:900;letter-spacing:.12em;color:var(--lime)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr b{font-size:22px;color:var(--txt)}
.pr .sb[data-act=reqStart]{width:92px;min-width:0;white-space:normal;line-height:1.25;text-align:center;padding:6px 8px}
.buy{border:0;border-radius:10px;padding:12px;background:var(--lime);color:var(--on);font:inherit;font-size:15px;font-weight:900;letter-spacing:.12em;cursor:pointer}
.buy:disabled{opacity:.4;cursor:not-allowed}
.mk{display:flex;flex-direction:column;gap:10px}
.mkhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.sortbar button{border:1px solid var(--dim);background:var(--field);color:var(--muted);border-radius:8px;padding:7px 12px;font:inherit;font-size:11px;letter-spacing:.15em;cursor:pointer}
.seg button.on,.sortbar button.on{background:var(--lime);color:var(--on);border-color:var(--lime);font-weight:800}
.live{font-size:10px;letter-spacing:.15em;color:var(--muted)}
.mkbody{height:390px;overflow:auto;border:1px solid var(--dim);border-radius:12px;background:var(--panel);padding:12px;position:relative}
.sub{display:none}.sub.on{display:block}
.mkbody .art{height:150px}
.ed{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.sortbar{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:10px;letter-spacing:.15em;color:var(--muted)}
.sortbar button{padding:5px 10px;font-size:10px}
.rw{display:grid;grid-template-columns:1.4fr 1fr 1.2fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--dim);font-size:13px}
.rw.hd{color:var(--muted);font-size:10px;letter-spacing:.15em}
.rw .mu{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw.sys b{color:var(--lime)}
.sb{border:1px solid var(--lime);background:transparent;color:var(--lime);border-radius:8px;padding:6px 12px;font:inherit;font-size:11px;font-weight:800;letter-spacing:.1em;cursor:pointer;min-width:78px}
.sb:disabled{opacity:.35;cursor:not-allowed}
.hrow{display:grid;grid-template-columns:1.4fr .5fr 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--dim);font-size:13px}
.mh{font-size:10px;letter-spacing:.18em;color:var(--muted);margin:10px 0 6px}
.mh b{color:var(--lime);margin-left:6px}
.mmsg{min-height:14px;font-size:11px;letter-spacing:.1em;color:var(--lime)}
.mmsg.err{color:var(--red)}
select{min-width:0;background:var(--field);border:1px solid var(--dim);border-radius:8px;padding:9px;color:var(--txt);font:inherit;font-size:13px}
.empty{color:var(--muted);font-size:12px;padding:14px;text-align:center;letter-spacing:.1em}
.av{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--lime);color:var(--lime);display:grid;place-items:center;background:#060905}
.av svg{width:60%;height:60%}
.av.big{width:64px;height:64px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ic{border:1px solid var(--dim);background:var(--field);color:var(--lime);border-radius:10px;padding:8px;display:grid;place-items:center;cursor:pointer}
.ic svg{width:26px;height:26px}
.ic.on{background:var(--lime);color:var(--on);border-color:var(--lime)}
.pfhead{display:flex;gap:14px;align-items:center}
.pfhead .col{flex:1;display:flex;gap:8px;min-width:0}
.pfhead .col input{flex:1;min-width:0}
#pfSave{flex:none;min-width:104px;padding:9px 12px;letter-spacing:0;text-align:center;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.lr{display:grid;grid-template-columns:38px 36px 1fr auto auto;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--dim);font-size:13px;cursor:pointer}
.lr:hover{background:var(--field)}
.lr.me{background:var(--field);box-shadow:inset 2px 0 0 var(--lime)}
.lr .rk{color:var(--muted);font-size:12px}
.lr .nmz{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .it{color:var(--muted);font-size:11px}
.lr .vl{color:var(--lime);font-weight:800}
.plus{display:block;margin:12px auto 4px;border:1px solid var(--lime);background:transparent;color:var(--lime);font:inherit;font-size:11px;line-height:1;padding:2px 7px;border-radius:3px;cursor:pointer;animation:plusGl 1.7s steps(1) infinite}
@keyframes plusGl{0%{transform:none;text-shadow:none}8%{transform:translate(-2px,1px);text-shadow:2px 0 var(--red),-2px 0 #fff}12%{transform:none;text-shadow:none}55%{transform:translate(2px,0) skewX(-12deg);text-shadow:-2px 0 var(--red)}59%{transform:none;text-shadow:none}84%{transform:translate(1px,-1px);clip-path:inset(0 0 55% 0)}88%{transform:none;clip-path:none}100%{transform:none}}
.coll{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--dim);font-size:13px}
.coll .th{width:34px;height:44px;flex:none;border:1px solid var(--dim);border-radius:6px;background:#030403;display:grid;place-items:center;overflow:hidden}
.coll .th svg{width:100%;height:100%}
.coll b{flex:1}.coll span{color:var(--muted);font-size:11px}
.pop{position:absolute;inset:0;background:var(--app);border-radius:18px;padding:22px;z-index:20;display:none;overflow:auto}
.pop.on{display:block}
.codes{border:1px solid var(--dim);border-radius:10px;padding:10px 12px;font-size:12px;letter-spacing:.1em;line-height:1.9}
.codes b{color:var(--lime)}
.ovl{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:900;padding:16px}
.ovp{width:min(100%,440px);background:var(--app);border:1px solid var(--dim);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.ovp h2{margin:0;color:var(--lime);letter-spacing:.25em;font-size:17px}
.ovp p{margin:0;color:var(--muted);font-size:11px;letter-spacing:.08em;line-height:1.6}
.ovp .go{width:100%}
.ovp .dis{border:1px solid var(--dim);background:var(--field);color:var(--muted);border-radius:10px;padding:12px;font:inherit;font-size:13px;letter-spacing:.15em;width:100%;opacity:.55;cursor:not-allowed}
#splash{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.gl{position:relative;font-size:clamp(24px,7vw,68px);font-weight:900;letter-spacing:.16em;color:#a8f21f;opacity:0;white-space:nowrap}
.gl::before,.gl::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%}
.gl::before{color:#e3ff9a;clip-path:inset(0 0 55% 0);transform:translateX(-5px)}
.gl::after{color:#4f7a0c;clip-path:inset(60% 0 0 0);transform:translateX(5px)}
.gl.in{animation:glIn .8s steps(1) forwards}
.gl.on{opacity:1}
.gl.on::before{animation:jitA .4s steps(1) infinite}
.gl.on::after{animation:jitB .33s steps(1) infinite}
.gl.out{animation:glOut .8s steps(1) forwards}
@keyframes glIn{0%{opacity:0}8%{opacity:1;transform:translate(-8px,3px) skewX(25deg) scaleY(.4)}16%{opacity:0}26%{opacity:1;transform:translate(6px,-2px) scaleX(1.15)}34%{opacity:.15}44%{opacity:1;transform:translate(0,0) scaleY(.15)}54%{opacity:1;transform:translate(-4px,0) skewX(-12deg)}68%{opacity:.3;transform:none}78%{opacity:1;transform:translate(3px,1px)}100%{opacity:1;transform:none}}
@keyframes glOut{0%{opacity:1;transform:none}14%{opacity:1;transform:translate(7px,-2px) skewX(20deg)}24%{opacity:0}34%{opacity:1;transform:translate(-6px,2px) scaleY(.2)}46%{opacity:.2}58%{opacity:1;transform:translate(4px,0) scaleX(1.2)}72%{opacity:0}84%{opacity:.8;transform:scaleY(.08)}100%{opacity:0}}
@keyframes jitA{0%{clip-path:inset(0 0 55% 0);transform:translateX(-5px)}25%{clip-path:inset(30% 0 40% 0);transform:translateX(6px)}50%{clip-path:inset(60% 0 5% 0);transform:translateX(-3px)}75%{clip-path:inset(10% 0 70% 0);transform:translateX(4px)}}
@keyframes jitB{0%{clip-path:inset(60% 0 0 0);transform:translateX(5px)}30%{clip-path:inset(5% 0 80% 0);transform:translateX(-6px)}60%{clip-path:inset(40% 0 30% 0);transform:translateX(3px)}}
.tap{color:#a8f21f;opacity:.75;letter-spacing:.35em;font-size:12px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@media(max-width:700px){.layout{grid-template-columns:1fr;gap:12px}.dial{width:min(100%,250px)}}
.ovp{max-height:92vh;overflow:auto}
.ovp .tt{font-size:14px;color:var(--txt);line-height:1.75;letter-spacing:.03em}
.ovp .tt b{color:var(--lime)}
.tdots{display:flex;gap:7px;justify-content:center}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.tdots i.on{background:var(--lime)}
.tbtns{display:flex;gap:8px}
.tbtns .ok,.tbtns .go{flex:1 1 0;width:auto!important;min-width:0;height:46px;padding:0;border:1px solid var(--lime);border-radius:10px;font:inherit;font-size:15px;font-weight:900;letter-spacing:.15em;cursor:pointer}
.tbtns .ok{background:var(--field);color:var(--lime)}
.tbtns .go{background:var(--lime);color:var(--on)}
.tbtns .ok:disabled,.tbtns .go:disabled{opacity:.3;cursor:not-allowed}
.pz{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--dim);background:var(--field);color:var(--text,inherit);border-radius:12px;padding:12px;margin-bottom:10px;font:inherit;cursor:pointer}
.pz:hover{border-color:var(--lime)}
.pz .pn{font-size:26px;font-weight:800;color:var(--lime);min-width:56px;letter-spacing:.04em}
.pz .pt{flex:1;font-size:12px;letter-spacing:.12em}.pz .pt small{display:block;color:var(--muted);margin-top:4px;font-size:10px}
.pz .pd{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.pz.done .pn{color:var(--muted)}
.pzart{border:1px solid var(--dim);border-radius:12px;overflow:hidden;background:#050705;margin-bottom:10px}
.pzart svg{display:block;width:100%;height:auto}
.pzh{font-size:14px;letter-spacing:.16em;color:var(--lime);margin:4px 0 8px;font-weight:800}
.pzs{font-size:13px;line-height:1.55;margin-bottom:12px}
.pzb{font-size:20px;letter-spacing:.35em;color:var(--lime);text-align:center;margin:6px 0 12px}
.pth{width:34px;height:44px;flex:none;border:1px solid var(--dim);border-radius:6px;background:#030403;display:grid;place-items:center;overflow:hidden}.pth svg{width:100%;height:100%}
#codesBody{height:480px}
.pzr{display:flex;gap:8px}.pzr input{flex:1;min-width:0}
</style></head>
<body class="boot">
<div id="splash"><div class="gl" id="gl" data-text="BE CAREFUL">BE CAREFUL</div><div class="tap" id="tap" style="display:none">CLICK TO START</div></div>
<main class="app" id="app">
<header><div class="logo">REACTOR</div><div class="sup" id="sup"></div>
<div class="right"><button class="snd" id="delAcc" aria-label="Delete account" title="Delete account" style="color:#ff4d3a;border-color:#5a2018"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button><button class="snd" id="help" aria-label="How to play" style="font:inherit;font-size:18px;font-weight:900">?</button><button class="snd" id="snd" aria-label="Sound"></button><div class="pts" aria-label="Energy" title="Energy"><svg class="bolt" width="18" height="22" viewBox="0 0 24 28" fill="#a8f21f" stroke="#a8f21f" stroke-width="1.5" stroke-linejoin="round"><path d="M14 1L3 16h7l-2 11 13-16h-8z"/></svg><strong id="pts">1,000</strong></div></div></header>
<div class="views">
<div class="view on" id="vRadar"><div class="layout">
  <section class="dial">
    <svg id="ring" viewBox="0 0 300 300"></svg>
    <svg id="needle" viewBox="0 0 300 300"><path d="M141 4 L159 4 L150 28Z" fill="#fff"/></svg>
    <div class="center" id="center"></div>
  </section>
  <section class="panel">
    <div class="potbox"><span class="pl">POT</span><span class="pv" id="pot">0</span></div>
    <div class="hint" id="hint"></div>
    <div class="odds">
      <div class="odd"><span><i style="background:var(--lime)"></i>NORMAL</span><b id="oN" style="color:var(--lime)"></b></div>
      <div class="odd"><span><i style="background:var(--amber)"></i>OVERHEAT</span><b id="oO" style="color:var(--amber)"></b></div>
    </div>
    <input id="stake" type="number" min="1" step="1" value="10" placeholder="STAKE">
    <button class="go" id="go">START</button>
    <button class="cash" id="cash">CASH OUT</button>
    <button class="fix" id="fix">FREEZE ×2</button>
    <div class="msg" id="msg"></div>
  </section>
</div></div>
<div class="view" id="vMarket"><div class="mk">
  <div class="mkhead"><div class="seg" id="seg"><button class="on" data-s="sShop">ALL</button><button data-s="sMy">MY</button></div><span class="live" id="live">CONNECTING…</span></div>
  <div class="mkbody" id="mkbody">
    <div class="sub on" id="sShop"><div class="shop" id="shop"></div><div id="sOffers"></div></div>
    <div class="sub" id="sMy"><div id="myAll"></div></div>
  </div>
  <div class="mmsg" id="mmsg"></div>
</div></div>
<div class="view" id="vTop"><div class="mk">
  <div class="mkhead"><div class="seg" id="topSort"><button class="on" data-k="vd">VALUE ▼</button><button data-k="va">VALUE ▲</button></div><span class="live" id="topInfo"></span></div>
  <div class="mkbody" id="topBody"></div>

<script>
/* ================= AUDIO (all sounds synthesized, no files) ================= */
const audio=(()=>{
  let ctx=null,master,mus,sfx,nb,timer=null,step=0,next=0,mode='calm',muted=false,rs=null;
  const f=m=>440*Math.pow(2,(m-69)/12);
  const BPM={calm:84,heat:122,super:144};
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    master=ctx.createGain();master.gain.value=muted?0:.8;master.connect(ctx.destination);
    mus=ctx.createGain();mus.gain.value=.0001;mus.connect(master);
    sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(master);
    nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    next=ctx.currentTime+.1;timer=setInterval(tick,40);
  }
  function tone(freq,t,dur,type,g,dest,lp){
    const o=ctx.createOscillator(),v=ctx.createGain();o.type=type;o.frequency.value=freq;
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let out=v;o.connect(v);
    if(lp){const b=ctx.createBiquadFilter();b.type='lowpass';b.frequency.value=lp;v.connect(b);out=b}
    out.connect(dest);o.start(t);o.stop(t+dur+.05);
  }
  function kick(t,g,dest){
    const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
    v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+.2);
    o.connect(v);v.connect(dest);o.start(t);o.stop(t+.25);
  }

      const bar=Math.floor(n/16)%4,root=[38,34,43,45][bar],Q=[[0,3,7],[0,4,7],[0,3,7],[0,4,7]][bar];

      src.connect(hp);hp.connect(g);g.connect(sfx);g.gain.setValueAtTime(0,t);

      const o=ctx.createOscillator(),og=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;o.type='sawtooth';

    riserCut(){if(!ctx||!rs)return;const t=ctx.currentTime;rs.g.gain.cancelScheduledValues(t);rs.g.gain.setValueAtTime(0,t);try{rs.src.stop(t+.02);rs.o.stop(t+.02)}catch(e){}rs=null}

/* ----- ring ----- */
function pt(a,r){const t=a*Math.PI/180;return[150+r*Math.sin(t),150-r*Math.cos(t)]}
function arc(a0,a1,c){
  const g=(a1-a0)>6?1.2:0,s=pt(a0+g,107),e=pt(a1-g,107),big=(a1-a0-2*g)>180?1:0;
  return `<path d="M${s[0]} ${s[1]} A107 107 0 ${big} 1 ${e[0]} ${e[1]}" fill="none" stroke="${c}" stroke-width="26"/>`;
}
function drawRing(){
  const p=effPo(),ac=accent();
  let h='<circle cx="150" cy="150" r="107" fill="none" stroke="#10170a" stroke-width="26"/>';
  h+=arc(0,(1-p)*360,ac)+arc((1-p)*360,360,AMBER);
  for(let i=0;i<72;i++){const p1=pt(i*5,124),p2=pt(i*5,i%6===0?132:128);h+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${ac}" stroke-opacity="${i%6===0?.6:.25}" stroke-width="1.5"/>`}
  h+=`<circle cx="150" cy="150" r="86" fill="#060905" stroke="${ac}" stroke-opacity=".25"/>`;
  $('ring').innerHTML=h;
}

/* ----- ui ----- */
function getStake(){const v=$('stake').value;return v===''?NaN:Number(v)}
function stakeOk(){const s=getStake();return Number.isInteger(s)&&s>=1&&s<=pts}

const freezeCharges=()=>freeze.filter(t=>t<=Date.now()).length;
function freezeLabel(){
  if(superOn)return 'FREEZE —';

  const w=Math.min(...freeze)-Date.now(),m=Math.max(0,Math.ceil(w/1000));
  return 'FREEZE '+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
function canFreeze(){return run&&!busy&&!superOn&&freezeCharges()>0&&(ovN>0||po>BASE)}

  $('hint').textContent=!run?'':ovN===0?'NEXT OVERHEAT −'+Math.round(r.first*100)+'% OF STAKE':(ovN===1&&!superOn)?'NEXT OVERHEAT −'+Math.round(r.second*100)+'% OF POT':'';

/* ----- round ----- */
function resetRun(){run=false;pot=0;ovN=0;po=BASE;stake0=0;heat=false}   // after a loss, accident or cash-out the reactor is brand new
function start(){
  if(busy)return;audio.init();
  if(!run){
    if(!stakeOk())return;
    const s=getStake();pts=fix(pts-s);pot=s;stake0=s;run=true;ovN=0;
  }
  busy=true;
  showCenter('','•••',accent());update();
  const p=effPo(),out=Math.random()<1-p?'normal':'overheat';
  const from=out==='normal'?0:1-p,size=out==='normal'?1-p:p;
  const target=(from+size*(0.1+0.8*Math.random()))*360;
  const cur=((rot%360)+360)%360,delta=(target-cur+360)%360;
  rot+=360*5+delta;$('needle').style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>finish(out),3300);
}
function flashBad(){
  $('app').classList.add('bad');$('pts').classList.add('loss');
  setTimeout(()=>{$('app').classList.remove('bad');$('pts').classList.remove('loss')},1400);
}
function finish(out){
  const r=R();
  if(out==='normal'){
    const g=fix(pot*r.gain);pot=fix(pot+g);
    if(!superOn)po=fix(Math.min(PO_MAX,po+STEP));
    heat=false;
    showCenter('NORMAL','+'+num(g),accent());audio.normal();syncMusic();update();
    pending=setTimeout(settle,1700);
    return;
  }
  ovN++;heat=true;
  if(ovN>=r.acc){
    // the last overheat is shown as an overheat first, then immediately as an accident that destroys everything
    const all=pot;
    showCenter('OVERHEAT','•••',AMBER);audio.warn();syncMusic();update();
    setTimeout(()=>{
      pot=0;heat=false;
      showCenter('ACCIDENT','−'+num(all),RED,'EVERYTHING LOST');
      flashBad();audio.horn();syncMusic();update();
      pending=setTimeout(settle,2800);
    },900);
    return;
  }
  const pct=ovN===1?r.first:r.second;
  const lost=fix(Math.min(pot,ovN===1?stake0*r.first:pot*r.second));pot=fix(pot-lost);
  if(!superOn)po=BASE;
  showCenter('OVERHEAT','−'+num(lost),AMBER,'−'+Math.round(pct*100)+'% '+(ovN===1?'OF STAKE':'OF POT'));
  audio.warn();syncMusic();update();
  pending=setTimeout(settle,1700);
}
function settle(){
  pending=null;resetNeedle();busy=false;
  if(pot<0.01)resetRun();
  drawRing();syncMusic();update();
  if(superOn&&Date.now()>=superEnd)superOff();
}
function cashOut(){
  if(!run||busy)return;
  const v=pot;pts=fix(pts+v);resetRun();
  showCenter('CASH OUT','+'+num(v),accent());audio.cash();drawRing();syncMusic();update();
}
function doFreeze(){
  if(!canFreeze())return;
  const i=freeze.findIndex(t=>t<=Date.now());freeze[i]=Date.now()+FREEZE_MS;
  ovN=0;po=BASE;heat=false;
  audio.freeze();showCenter('FREEZE','RESET',accent(),'OVERHEATS CLEARED');say('FROZEN: 3 OVERHEATS AVAILABLE AGAIN');
  drawRing();syncMusic();update();
}

function superStart(secs){

  showCenter('SUPER GAME','START',accent());drawRing();
  audio.superOn();syncMusic();say('SUPER GAME · '+secs+'s');

/* ----- tiny 3D engine: sports car (lime / black only) ----- */
const CAR=(()=>{
  const ST=[[2.2,.55,.5,.18,.30,.34,.40],[1.9,.85,.78,.16,.42,.50,.70],[1.2,.95,.86,.14,.55,.62,.82],[.5,.96,.88,.14,.60,.68,.80],
            [0,.94,.86,.14,.62,1.02,.46],[-.7,.95,.86,.14,.66,1.08,.42],[-1.3,.97,.88,.14,.70,.84,.70],[-2.0,.92,.84,.14,.64,.74,.64],[-2.25,.80,.72,.20,.55,.62,.58]];
  const V=[],F=[];
  const addV=p=>{V.push(p);return V.length-1};
  const ring=([x,w,wb,yb,ys,yt,wt])=>[[x,yb,-wb],[x,yb+.12,-w],[x,ys,-w],[x,yt,-wt],[x,yt,wt],[x,ys,w],[x,yb+.12,w],[x,yb,wb]];
  const rings=ST.map(s=>ring(s).map(addV));
  const body=[0,.5,0];
  for(let s=0;s<rings.length-1;s++)for(let j=0;j<8;j++){
    F.push({v:[rings[s][j],rings[s][(j+1)%8],rings[s+1][(j+1)%8],rings[s+1][j]],k:(s>=3&&s<=5&&j>=2&&j<=4)?'glass':'body',ref:body,bias:0});
  }
  F.push({v:rings[0].slice(),k:'body',ref:body,bias:0});F.push({v:rings[rings.length-1].slice(),k:'body',ref:body,bias:0});
  function wheel(x,z0,sg){
    const N=16,Rr=.34,cy=.34,z1=z0+sg*.28,ref=[x,cy,(z0+z1)/2],o=[],i=[],r=[],h=[];
    for(let k=0;k<N;k++){const a=k/N*2*Math.PI,c=Math.cos(a),s=Math.sin(a);
      o.push(addV([x+Rr*c,cy+Rr*s,z0]));i.push(addV([x+Rr*c,cy+Rr*s,z1]));
      r.push(addV([x+.23*c,cy+.23*s,z1+sg*.004]));h.push(addV([x+.07*c,cy+.07*s,z1+sg*.006]))}
    for(let k=0;k<N;k++){const k2=(k+1)%N;F.push({v:[o[k],o[k2],i[k2],i[k]],k:'tire',ref,bias:0})}
    F.push({v:i,k:'tire',ref,bias:0});F.push({v:r,k:'rim',ref,bias:.05});F.push({v:h,k:'hub',ref,bias:.08});
  }
  [[1.35,.72,1],[1.35,-.72,-1],[-1.35,.72,1],[-1.35,-.72,-1]].forEach(a=>wheel(...a));
  F.forEach(f=>{
    const p=f.v.map(i=>V[i]),a=p[0],b=p[1],c=p[2];
    const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
    const m=Math.hypot(...n)||1;n=n.map(x=>x/m);
    const ctr=[0,1,2].map(k=>p.reduce((s,q)=>s+q[k],0)/p.length);
    if(n[0]*(ctr[0]-f.ref[0])+n[1]*(ctr[1]-f.ref[1])+n[2]*(ctr[2]-f.ref[2])<0)n=n.map(x=>-x);
    f.n=n;
  });
  let ang=-0.75,tilt=.26,drag=false,lx=0;
  const L=(()=>{const v=[-.35,.75,.55],m=Math.hypot(...v);return v.map(x=>x/m)})();
  function limeRGB(){
    const c=getComputedStyle(document.body).getPropertyValue('--lime').trim();
    const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
    return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[168,242,31];
  }
  function draw(cv){
    const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
    if(!W||!H)return;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle='#030403';g.fillRect(0,0,W,H);
    const lime=limeRGB(),S=Math.min(W/6.6,H/2.6),cx=W/2,cy=H*.62;
    const ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(tilt),st=Math.sin(tilt);
    const rot=p=>{const x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca;return[x,p[1]*ct-z*st,p[1]*st+z*ct]};
    g.strokeStyle=`rgba(${lime[0]},${lime[1]},${lime[2]},.14)`;g.lineWidth=1;
    for(let i=-3;i<=3;i++){
      const a=rot([i*.9,0,-3]),b=rot([i*.9,0,3]),c=rot([-3.2,0,i*.9]),d=rot([3.2,0,i*.9]);
      g.beginPath();g.moveTo(cx+a[0]*S,cy-a[1]*S);g.lineTo(cx+b[0]*S,cy-b[1]*S);g.moveTo(cx+c[0]*S,cy-c[1]*S);g.lineTo(cx+d[0]*S,cy-d[1]*S);g.stroke();
    }
    const T=V.map(rot),vis=[];
    F.forEach(f=>{
      const n=f.n,nx=n[0]*ca+n[2]*sa,nz0=-n[0]*sa+n[2]*ca,ny=n[1]*ct-nz0*st,nz=n[1]*st+nz0*ct;
      if(nz<=0.001)return;
      const z=f.v.reduce((s,i)=>s+T[i][2],0)/f.v.length+f.bias;
      vis.push({f,z,b:Math.max(0,nx*L[0]+ny*L[1]+nz*L[2])});
    });
    vis.sort((a,b)=>a.z-b.z);
    vis.forEach(({f,b})=>{
      let col,stroke;
      if(f.k==='body'){const k=.14+.86*b;col=`rgb(${lime[0]*k|0},${lime[1]*k|0},${lime[2]*k|0})`;stroke='rgba(3,4,3,.75)'}
      else if(f.k==='glass'){col=`rgb(${6+b*16|0},${10+b*34|0},${4+b*6|0})`;stroke=`rgba(${lime[0]},${lime[1]},${lime[2]},.45)`}
      else if(f.k==='tire'){col='rgb(8,11,7)';stroke='rgba(60,80,20,.5)'}
      else if(f.k==='rim'){const k=.35+.65*b;col=`rgb(${lime[0]*k|0},${lime[1]*k|0},${lime[2]*k|0})`;stroke='rgba(3,4,3,.8)'}
      else{col='rgb(4,6,4)';stroke='rgba(3,4,3,1)'}
      g.beginPath();f.v.forEach((i,k)=>{const p=T[i],x=cx+p[0]*S,y=cy-p[1]*S;k?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();
      g.fillStyle=col;g.fill();g.strokeStyle=stroke;g.lineWidth=1;g.stroke();
    });
  }
  function start(cv){
    cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;cv.setPointerCapture(e.pointerId)});
    cv.addEventListener('pointermove',e=>{if(drag){ang+=(e.clientX-lx)*.012;lx=e.clientX}});
    ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>drag=false));
    (function f(){requestAnimationFrame(f);if(activeTab!=='market')return;if(!drag)ang+=.008;draw(cv)})();
  }
  return{start};
})();
ITEMS.filter(it=>it.cv).forEach(it=>CAR.start(it.cv));

/* ================= SHARED BACKEND =================
   Published page: the artifact "db" capability (real players share one market, profiles and ranks).
   Plain file: a local database on this device (only you in it). */
function makeLocalDB(){
  let S={};try{S=JSON.parse(localStorage.getItem('reactor_db')||'{}')}catch(e){}
  const subs=new Set(),leases={},rid=()=>Math.random().toString(36).slice(2,10);
  const persist=()=>{try{localStorage.setItem('reactor_db',JSON.stringify(S))}catch(e){}};
  const par=p=>p.slice(0,p.lastIndexOf('/'));
  const dsnap=p=>({id:p.split('/').pop(),exists:p in S,data:()=>p in S?JSON.parse(JSON.stringify(S[p])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  const touch=()=>{persist();setTimeout(()=>subs.forEach(fn=>fn()),0)};
  const mkSnap=(c,flt)=>{const docs=Object.keys(S).filter(k=>par(k)===c&&flt.every(([f,v])=>S[k][f]===v)).map(dsnap);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}};
  function docRef(p){return{id:p.split('/').pop(),path:p,
    get:async()=>dsnap(p),
    set:async d=>{S[p]=JSON.parse(JSON.stringify(d));touch()},
    update:async d=>{if(!(p in S))throw{code:'invalid_argument'};Object.assign(S[p],d);touch()},
    delete:async()=>{delete S[p];touch()},
    acquire:async o=>{const now=Date.now();if((leases[p]||0)>now&&leases[p+'#h']!==o.holder)return{acquired:false};leases[p]=now+(o.ttlMs||30000);leases[p+'#h']=o.holder;return{acquired:true,holder:o.holder}},
    onSnapshot(next){const fn=()=>next(dsnap(p));subs.add(fn);setTimeout(fn,0);return()=>subs.delete(fn)},
    collection:c=>colRef(p+'/'+c)}}
  function colRef(c,flt=[]){const q={path:c,
    where:(f,op,v)=>colRef(c,flt.concat([[f,v]])),orderBy:()=>q,limit:()=>q,
    get:async()=>mkSnap(c,flt),
    onSnapshot(next){const fn=()=>next(mkSnap(c,flt));subs.add(fn);setTimeout(fn,0);return()=>subs.delete(fn)},
    doc:id=>docRef(c+'/'+(id||rid())),
    add:async d=>{const r=docRef(c+'/'+rid());await r.set(d);return r}};return q}
  return{doc:docRef,collection:p=>colRef(p)};
}

  function colRef(c,flt=[]){const q={path:c,
    where:(f,op,v)=>colRef(c,flt.concat([[f,v]])),orderBy:()=>q,limit:()=>q,
    async fetch(){let r=sb.from('docs').select('path,data').eq('col',c).limit(1000);flt.forEach(([f,v])=>{r=r.eq('data->>'+f,String(v))});
      const x=await r;if(x.error)fail(x.error);const docs=x.data.map(row=>dsnap(row.path,row));return{docs,size:docs.length,empty:!docs.length}},
    get:()=>q.fetch(),
    onSnapshot(next,err){const fn=async()=>{try{next(await q.fetch())}catch(e){if(err)err(e)}};subs.add(fn);fn();return()=>subs.delete(fn)},
    doc:id=>docRef(c+'/'+(id||rid())),
    add:async d=>{const p=c+'/'+rid();const r=await sb.from('docs').insert({path:p,col:c,data:d,owner:uid});if(r.error)fail(r.error);kick();return docRef(p)}};return q}
  return{db:{doc:docRef,collection:p=>colRef(p),signOut:async()=>{try{await sb.auth.signOut()}catch(e){}}},uid};
}
let mk={db:null,uid:null,live:false,ro:false,ready:false,owner:false};

/* ----- trades ----- */
async function buySupply(id){
  const it=ITEM[id],ref=mk.db.doc('supply/'+id);
  if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get(),left=s.exists?Number(s.data().left):it.edition;
  if(!(left>=1))return mnote('SOLD OUT',true);
  if(pts<it.price)return mnote('NOT ENOUGH POINTS',true);
  await ref.set({left:left-1});
  pts=fix(pts-it.price);inv[id]++;update();mnote('BOUGHT '+it.name.toUpperCase());
}
async function buyAsk(id){
  const ref=mk.db.doc('asks/'+id);
  if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get();if(!s.exists)return mnote('ALREADY SOLD',true);
  const a=s.data();if(!ITEM[a.item]||a.seller===mk.uid)return;
  if(pts<a.price)return mnote('NOT ENOUGH POINTS',true);
  await ref.delete();
  pts=fix(pts-a.price);inv[a.item]++;update();
  await mk.db.collection('mail').add({to:a.seller,kind:'sale',item:a.item,points:a.price,t:Date.now()});
  mnote('BOUGHT '+ITEM[a.item].name.toUpperCase());
}
async function cancelAsk(id){
  const ref=mk.db.doc('asks/'+id);if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get();if(!s.exists)return mnote('ALREADY SOLD',true);
  const a=s.data();if(a.seller!==mk.uid)return;
  await ref.delete();inv[a.item]++;update();mnote('LISTING CANCELLED');
}
async function listItem(id){
  const price=Number($('lp_'+id).value);
  if(!Number.isInteger(price)||price<1)return mnote('ENTER A PRICE (WHOLE NUMBER)',true);
  if(inv[id]<1)return mnote('YOU DO NOT OWN THIS',true);
  inv[id]--;update();
  try{await mk.db.collection('asks').add({item:id,price,seller:mk.uid,t:Date.now()});$('lp_'+id).value='';mnote('LISTED FOR '+num(price))}
  catch(e){inv[id]++;update();throw e}
}
async function makeRequest(){
  const id=offItem,price=Number($('rqPrice').value);
  if(!id||!ITEM[id])return;
  if(!asks.some(a=>a.item===id))return mnote('NO REAL SELLERS YET, ONLY THE SYSTEM. WAIT UNTIL SOMEONE LISTS AN OFFER',true);
  if(!Number.isInteger(price)||price<1)return mnote('ENTER A PRICE (WHOLE NUMBER)',true);
  if(price>pts)return mnote('NOT ENOUGH POINTS',true);
  pts=fix(pts-price);update();
  try{await mk.db.collection('bids').add({item:id,price,buyer:mk.uid,t:Date.now()});$('rqPrice').value='';mnote('REQUEST PLACED')}
  catch(e){pts=fix(pts+price);update();throw e}
}
async function fillBid(id){
  const ref=mk.db.doc('bids/'+id);if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get();if(!s.exists)return mnote('REQUEST IS GONE',true);
  const b=s.data();if(!ITEM[b.item]||b.buyer===mk.uid)return;
  if(inv[b.item]<1)return mnote('YOU DO NOT OWN THIS',true);
  await ref.delete();
  inv[b.item]--;pts=fix(pts+b.price);update();
  await mk.db.collection('mail').add({to:b.buyer,kind:'item',item:b.item,t:Date.now()});
  mnote('SOLD FOR '+num(b.price));
}
async function cancelBid(id){
  const ref=mk.db.doc('bids/'+id);if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get();if(!s.exists)return mnote('REQUEST IS GONE',true);
  const b=s.data();if(b.buyer!==mk.uid)return;
  await ref.delete();pts=fix(pts+b.price);update();mnote('REQUEST CANCELLED, POINTS RETURNED');
}
function processMail(d){
  if(mailDone.has(d.id))return;mailDone.add(d.id);
  const m=d.data()||{};
  if(m.kind==='sale'&&ITEM[m.item]&&Number.isFinite(m.points)&&m.points>0&&m.points<1e10){pts=fix(pts+m.points);mnote('SOLD '+ITEM[m.item].name.toUpperCase()+' +'+num(m.points))}
  else if(m.kind==='item'&&ITEM[m.item]){inv[m.item]++;mnote('REQUEST FILLED: '+ITEM[m.item].name.toUpperCase())}
  mk.db.doc('mail/'+d.id).delete().catch(()=>{});update();
}

/* ----- market rendering (with sorting) ----- */
function sortOrders(list,priceKey){
  const k=sortMode,L=list.filter(a=>ITEM[a.item]&&Number.isFinite(a[priceKey]));
  if(k==='pa')return L.sort((x,y)=>x[priceKey]-y[priceKey]);
  if(k==='pd')return L.sort((x,y)=>y[priceKey]-x[priceKey]);
  return L.sort((x,y)=>x.item===y.item?x[priceKey]-y[priceKey]:ITEM[x.item].name<ITEM[y.item].name?-1:1);
}
const sortbar=()=>`<div class="sortbar">SORT <button data-sort="pa" class="${sortMode==='pa'?'on':''}">PRICE ▲</button><button data-sort="pd" class="${sortMode==='pd'?'on':''}">PRICE ▼</button></div>`;
let offItem=null,reqItem=null;
const keepIn=(el,fn)=>{const v={};el.querySelectorAll('input').forEach(x=>{if(x.id)v[x.id]=x.value});const ae=document.activeElement&&document.activeElement.id;fn();Object.entries(v).forEach(([k,val])=>{const x=$(k);if(x)x.value=val});if(ae&&$(ae)&&el.contains($(ae)))$(ae).focus()};
function bestFor(it){
  const l=supply[it.id]!==undefined?supply[it.id]:it.edition,A=asks.filter(a=>a.item===it.id&&Number.isFinite(a.price)),c=[];
  if(l>0)c.push({price:it.price,sys:true});
  const all=c.map(x=>x.price).concat(A.map(a=>a.price));
  A.filter(a=>a.seller!==mk.uid).forEach(a=>c.push({price:a.price,id:a.id}));
  c.sort((x,y)=>x.price-y.price||(x.sys?-1:1));
  return{shown:c[0]?c[0].price:null,buy:c[0]||null};
}
function renderMarket(){

  /* OFFERS */

      if(!A.length&&l<1)h+='<div class="empty">NOTHING ON SALE</div>';

    if(MA.length)h+='<div class="mh">YOUR OFFERS</div>'+mh+MA.map(a=>`<div class="rw"><b>${esc(ITEM[a.item].name)}</b><span>${num(a.price)}</span><span></span><button class="sb" data-act="cancelAsk" data-id="${esc(a.id)}">CANCEL</button></div>`).join('');
    if(MB.length)h+='<div class="mh">YOUR BUY REQUESTS</div>'+mh+MB.map(b=>`<div class="rw"><b>${esc(ITEM[b.item].name)}</b><span>${num(b.price)}</span><span></span><button class="sb" data-act="cancelBid" data-id="${esc(b.id)}">CANCEL</button></div>`).join('');

const collHTML=o=>{
  const rows=ITEMS.filter(it=>(o&&o[it.id])>0).map(it=>`<div class="coll"><div class="th">${it.thumb}</div><b>${esc(it.name)}</b><span>×${o[it.id]} · ${num(o[it.id]*it.price)}</span></div>`);
  return rows.length?rows.join(''):'<div class="empty">NOTHING COLLECTED YET</div>';
};
const TIERS=[50,200,500];
function renderTop(){
  if(!$('topBody'))return;
  const val=p=>Number.isFinite(p.value)?p.value:collValue(p.inv);
  const cnt=(p,k)=>Math.max(0,Number(p.inv&&p.inv[k])||0);
  const list=players.filter(p=>p.name).slice();
  if(topSort==='vd')list.sort((a,b)=>val(b)-val(a));else if(topSort==='va')list.sort((a,b)=>val(a)-val(b));
  else list.sort((a,b)=>cnt(b,topSort)-cnt(a,topSort)||val(b)-val(a));
  const lim=TIERS[topTier],shown=list.slice(0,lim);
  let h=shown.map((p,i)=>`<div class="lr${p.id===mk.uid?' me':''}" data-uid="${esc(p.id)}"><span class="rk">#${i+1}</span>${avatar(p.icon)}<span class="nmz">${esc(p.name)}</span><span class="it">${ITEMS.map(it=>'×'+cnt(p,it.id)).join(' ')}</span><span class="vl">${num(val(p))}</span></div>`).join('');

  if(list.length>lim&&topTier<TIERS.length-1)h+=`<button class="plus" id="topPlus" aria-label="Show more">+</button>`;

  o.style.zIndex=1100;
  o.querySelector('#daNo').onclick=()=>o.remove();
  o.querySelector('#daYes').onclick=async()=>{
    o.querySelector('#daYes').disabled=true;
    try{
      if(mk.db&&mk.live){
        const uid=mk.uid;
        for(const a of asks.filter(x=>x.seller===uid))try{await mk.db.doc('asks/'+a.id).delete()}catch(e){}
        for(const b of bids.filter(x=>x.buyer===uid))try{await mk.db.doc('bids/'+b.id).delete()}catch(e){}
        // mark as deleted first (works under any rules), then try to remove the rows completely
        try{await mk.db.doc('players/'+uid).set({deleted:true,name:'',icon:0,inv:{},value:0,t:Date.now()})}catch(e){}
        try{await mk.db.doc('data/users/'+uid+'/wallet').set({pts:0,inv:{},freeze:[0,0],codeUsed:[]})}catch(e){}
        try{await mk.db.doc('players/'+uid).delete()}catch(e){}
        try{await mk.db.doc('data/users/'+uid+'/wallet').delete()}catch(e){}
        if(mk.db.signOut)await mk.db.signOut();
      }
    }catch(e){}
    try{const keep=localStorage.getItem('reactor_owner');Object.keys(localStorage).filter(k=>k.startsWith('reactor_')||k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k));if(keep)localStorage.setItem('reactor_owner',keep)}catch(e){}

    const draw=()=>{o.querySelector('#sIcons').innerHTML=ICONS.map((ic,i)=>`<button class="ic${i===icon?' on':''}" data-i="${i}" title="${ic[0]}">${iconSvg(i)}</button>`).join('')};
    draw();
    o.querySelector('#sIcons').onclick=e=>{const b=e.target.closest('.ic');if(b){icon=Number(b.dataset.i);draw()}};
    o.querySelector('#sGo').onclick=()=>{
      const n=o.querySelector('#sName').value.trim();
      if(!validName(n)){o.querySelector('#sErr').textContent='3-16 LETTERS, DIGITS, SPACE, _ OR -';return}
      profile={name:n,icon};o.remove();res();
    };
  });
}

/* ----- connect ----- */
async function connect(){
  let db=null,uid=null,live=false,ro=false,owner=true;
  try{
    if(window.supabase&&typeof SUPA_URL!=='undefined'){
      const r=await Promise.race([makeSupaDB(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);
      db=r.db;uid=r.uid;live=true;owner=isOwnerDevice();
    }
  }catch(e){console.warn('supabase unavailable',e);window.__connErr=String((e&&(e.message||e.code))||e);db=null}
  try{
    if(!db&&typeof claude!=='undefined'&&claude&&claude.use){
      const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(d&&u){const id=await u.id();if(id){db=d;uid=String(id);live=true;try{ro=(await u.can('data.write'))===false}catch(e){}try{owner=await u.isOwner()}catch(e){owner=false}}}
    }
  }catch(e){}
  if(!db){db=makeLocalDB();uid='me';owner=true}
  mk={db,uid,live,ro,ready:false,owner};
  $('live').textContent=(live?(ro?'LIVE · READ-ONLY':'LIVE · SHARED MARKET'):'OFFLINE · THIS DEVICE ONLY'+(window.__connErr?' · '+window.__connErr.slice(0,70):(window.supabase?'':' · LIBRARY NOT LOADED')));
  try{const p=await db.doc('players/'+uid).get();if(p.exists){const d=p.data();if(d&&d.name)profile={name:String(d.name),icon:Number(d.icon)||0}}}catch(e){}
  try{
    const w=await db.doc('data/users/'+uid+'/wallet').get();
    if(w.exists){const d=w.data();
      if(Number.isFinite(d.pts)&&d.pts>=0)pts=d.pts;
      if(d.inv)ITEMS.forEach(it=>inv[it.id]=Math.max(0,Math.floor(Number(d.inv[it.id])||0)));
      if(Array.isArray(d.freeze))freeze=[Number(d.freeze[0])||0,Number(d.freeze[1])||0];
      if(Array.isArray(d.codeUsed))codeUsed=d.codeUsed.filter(k=>typeof k==='string').slice(-10)}
  }catch(e){}
  lastSaved=JSON.stringify({pts,inv,freeze,codeUsed});
  const err=()=>{};
  db.collection('asks').onSnapshot(s=>{asks=s.docs.map(d=>({id:d.id,...d.data()}));renderMarket()},err);
  db.collection('bids').onSnapshot(s=>{bids=s.docs.map(d=>({id:d.id,...d.data()}));renderMarket()},err);
  db.collection('supply').onSnapshot(s=>{supply={};s.docs.forEach(d=>{supply[d.id]=Number(d.data().left)});renderMarket()},err);
  db.collection('players').onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.deleted);renderTop();renderMarket()},err);
  db.collection('mail').where('to','==',uid).onSnapshot(s=>s.docs.forEach(processMail),err);
  mk.ready=true;
}

/* ----- splash: "BE CAREFUL" glitches in, riser, glitches out, riser is cut, game opens ----- */
async function splash(){
  const gl=$('gl'),tap=$('tap');
  audio.init();
  if(!window.__gest){
    tap.style.display='block';
    await new Promise(r=>{const go=()=>{document.removeEventListener('pointerdown',go);document.removeEventListener('keydown',go);r()};document.addEventListener('pointerdown',go);document.addEventListener('keydown',go)});
    audio.init();await sleep(120);
  }
  tap.style.display='none';

  audio.riser(3.3);
  await sleep(250);
  gl.classList.add('in');audio.glitch();
  await sleep(800);gl.classList.remove('in');gl.classList.add('on');
  await sleep(1300);
  gl.classList.remove('on');gl.classList.add('out');audio.glitch();
  await sleep(800);
  audio.riserCut();$('splash').remove();
}
function fitNow(){const app=$('app');app.style.zoom=1;const pad=14,z=Math.min(1,(innerWidth-pad*2)/app.offsetWidth,(innerHeight-pad*2)/app.offsetHeight);app.style.zoom=z}

<style>

.mk{display:flex;flex-direction:column;gap:10px}

.mkbody{flex:1 1 0;height:0;min-height:380px;overflow-x:hidden;overflow-y:auto;border:0;border-radius:0;background:transparent;margin:0 -14px;padding:4px 14px;position:relative;touch-action:pan-y}

.rw .mu{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sb{border:1px solid var(--lime);background:transparent;color:var(--lime);border-radius:8px;padding:6px 12px;font:inherit;font-size:11px;font-weight:800;letter-spacing:.1em;cursor:pointer;min-width:78px}

@keyframes plusGl{0%{transform:none;text-shadow:none}8%{transform:translate(-2px,1px);text-shadow:2px 0 var(--red),-2px 0 #fff}12%{transform:none;text-shadow:none}55%{transform:translate(2px,0) skewX(-12deg);text-shadow:-2px 0 var(--red)}59%{transform:none;text-shadow:none}84%{transform:translate(1px,-1px);clip-path:inset(0 0 55% 0)}88%{transform:none;clip-path:none}100%{transform:none}}
.coll{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--dim);font-size:13px}

.ovp .go{width:100%}
.ovp .dis{border:1px solid var(--dim);background:var(--field);color:var(--muted);border-radius:10px;padding:12px;font:inherit;font-size:13px;letter-spacing:.15em;width:100%;opacity:.55;cursor:not-allowed}
#splash{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.gl{position:relative;font-size:clamp(24px,7vw,68px);font-weight:900;letter-spacing:.16em;color:#a8f21f;opacity:0;white-space:nowrap}
.gl::before,.gl::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%}
.gl::before{color:#e3ff9a;clip-path:inset(0 0 55% 0);transform:translateX(-5px)}
.gl::after{color:#4f7a0c;clip-path:inset(60% 0 0 0);transform:translateX(5px)}
.gl.in{animation:glIn .8s steps(1) forwards}

.gl.on::before{animation:jitA .4s steps(1) infinite}

@keyframes glIn{0%{opacity:0}8%{opacity:1;transform:translate(-8px,3px) skewX(25deg) scaleY(.4)}16%{opacity:0}26%{opacity:1;transform:translate(6px,-2px) scaleX(1.15)}34%{opacity:.15}44%{opacity:1;transform:translate(0,0) scaleY(.15)}54%{opacity:1;transform:translate(-4px,0) skewX(-12deg)}68%{opacity:.3;transform:none}78%{opacity:1;transform:translate(3px,1px)}100%{opacity:1;transform:none}}

@keyframes jitA{0%{clip-path:inset(0 0 55% 0);transform:translateX(-5px)}25%{clip-path:inset(30% 0 40% 0);transform:translateX(6px)}50%{clip-path:inset(60% 0 5% 0);transform:translateX(-3px)}75%{clip-path:inset(10% 0 70% 0);transform:translateX(4px)}}
@keyframes jitB{0%{clip-path:inset(60% 0 0 0);transform:translateX(5px)}30%{clip-path:inset(5% 0 80% 0);transform:translateX(-6px)}60%{clip-path:inset(40% 0 30% 0);transform:translateX(3px)}}

  }
}

      if(s%2===0){const a=[Q[0],Q[2],Q[1],Q[2]][(s/2)%4];tone(f(root+12+a),t,sd*1.6,'triangle',.034,mus,1700)}

    if(!ctx)return;

    while(next<ctx.currentTime+.2){sched(step,next);next+=60/BPM[mode]/4;step++}
  }
  function duck(sec){const t=ctx.currentTime;mus.gain.cancelScheduledValues(t);mus.gain.setValueAtTime(.06,t);mus.gain.linearRampToValueAtTime(.55,t+sec)}
  return{
    init,
    running:()=>!!ctx&&ctx.state==='running',
    mode(m){if(m!==mode){mode=m;step=0}},
    musicGate(on){if(!ctx)return;const t=ctx.currentTime;mus.gain.cancelScheduledValues(t);mus.gain.setValueAtTime(mus.gain.value,t);mus.gain.linearRampToValueAtTime(on?.55:.0001,t+.25)},
    toggle(){muted=!muted;if(ctx)master.gain.setTargetAtTime(muted?0:.8,ctx.currentTime,.05);return muted},
    isMuted:()=>muted,
    normal(){if(!ctx)return;const t=ctx.currentTime;tone(784,t,.5,'sine',.12,sfx);tone(1175,t+.07,.6,'sine',.09,sfx)},
    warn(){if(!ctx)return;const t=ctx.currentTime;[0,.22,.44].forEach(d=>tone(880,t+d,.14,'square',.07,sfx,2500))},
    horn(){

      const o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(30,t+2.4);
      v.gain.setValueAtTime(.5,t);v.gain.exponentialRampToValueAtTime(.001,t+2.6);o.connect(v);v.connect(sfx);o.start(t);o.stop(t+2.7);

    },
    cash(){if(!ctx)return;const t=ctx.currentTime;[988,1319,1568,1976].forEach((fr,i)=>tone(fr,t+i*.09,.35,'sine',.1,sfx))},
    superOn(){if(!ctx)return;const t=ctx.currentTime;[60,64,67,72,76,79,84].forEach((m,i)=>tone(f(m),t+i*.06,.25,'triangle',.09,sfx))},
    superOff(){if(!ctx)return;const t=ctx.currentTime;[79,72,67,60].forEach((m,i)=>tone(f(m),t+i*.1,.3,'triangle',.08,sfx))},
    // fire-extinguisher spray, but digital and glitchy: gated noise with jumping filter + bit-blips
    freeze(){
      if(!ctx)return;const t=ctx.currentTime,dur=1.5,stepT=.024,N=Math.floor(dur/stepT);

    // something went wrong: stutter, buzz, falling chirp

      noise(t,.35,.22,'bandpass',3000,sfx);noise(t+.2,.2,.18,'highpass',6000,sfx);
      const o=ctx.createOscillator(),v=ctx.createGain();o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(110,t+.55);
      v.gain.setValueAtTime(.05,t);v.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(v);v.connect(sfx);o.start(t);o.stop(t+.65);
    },
    riser(dur){
      if(!ctx)return;const t=ctx.currentTime,g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.5,t+dur);g.connect(sfx);
      const src=ctx.createBufferSource();src.buffer=nb;src.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;

/* ================= GAME ================= */
let LIME='#a8f21f',AMBER='#f2c230',RINGBG='#10170a';const PURP='#b980ff',RED='#ff3b30';
const START_PTS=1000,BASE=.15,STEP=.15,PO_MAX=.45;      // normal: overheat chance 15% -> 30% -> 45%; super: always 10%
const RULES={
  normal:{gain:.2,first:.15,second:.40,acc:3},  // overheat #1 -15% of stake, #2 -40% of pot, #3 = accident
};
const FREEZE_MS=60*60*1000;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fix=x=>Math.round(x*100)/100;
const num=x=>fix(x).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pts=START_PTS,pot=0,run=false,ovN=0,stake0=0,po=BASE,busy=false,walletReady=false;
let rot=0,pending=null,msgT=null,heat=false,nSnap=null;
let freeze=[0,0],codeAt=0,codeUsed=[];                // two freeze charges; each one comes back 60 min after use
const accent=()=>LIME;
const effPo=()=>po;
const R=()=>RULES.normal;


/* ----- ring ----- */
function pt(a,r){const t=a*Math.PI/180;return[150+r*Math.sin(t),150-r*Math.cos(t)]}
function arc(a0,a1,c){
  const g=(a1-a0)>6?1.2:0,s=pt(a0+g,107),e=pt(a1-g,107),big=(a1-a0-2*g)>180?1:0;
  return `<path d="M${s[0]} ${s[1]} A107 107 0 ${big} 1 ${e[0]} ${e[1]}" fill="none" stroke="${c}" stroke-width="26"/>`;
}
function drawRing(){
  const p=effPo(),ac=accent();
  let h='<circle cx="150" cy="150" r="107" fill="none" stroke="${RINGBG}" stroke-width="26"/>';
  h+=arc(0,(1-p)*360,ac)+arc((1-p)*360,360,AMBER);
  for(let i=0;i<72;i++){const p1=pt(i*5,124),p2=pt(i*5,i%6===0?132:128);h+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${ac}" stroke-opacity="${i%6===0?.6:.25}" stroke-width="1.5"/>`}
  h+=`<circle cx="150" cy="150" r="86" fill="#060905" stroke="${ac}" stroke-opacity=".25"/>`;
  $('ring').innerHTML=h;
}
let startAng=0;
function resetNeedle(){const n=$('needle');n.style.transition='none';n.style.transform=`rotate(${startAng}deg)`;rot=startAng;void n.offsetWidth;n.style.transition=''}
(function(){
  const d=document.querySelector('.dial');let drag=false;
  const ang=e=>{const b=d.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2);return(Math.atan2(x,-y)*180/Math.PI+360)%360};
  const set=e=>{const n=$('needle');n.style.transition='none';startAng=ang(e);rot=startAng;n.style.transform=`rotate(${startAng}deg)`};
  d.addEventListener('pointerdown',e=>{if(busy)return;drag=true;try{d.setPointerCapture(e.pointerId)}catch(_){}set(e);e.preventDefault()});
  d.addEventListener('pointermove',e=>{if(drag&&!busy)set(e)});
  const up=()=>{drag=false};d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
})();
function showCenter(label,val,color,sub){if(color===LIME||color===PURP)color='var(--lime)';$('center').innerHTML=`<div class="lbl" style="color:${color}">${label}</div><div class="val" style="color:${color}">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}`}

/* ----- ui ----- */
let stakePct=10;
function getStake(){return Math.max(1,Math.floor(pts*stakePct/100))}
function stakeOk(){const s=getStake();return Number.isInteger(s)&&s>=1&&s<=pts}
function say(t,err){const m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'');clearTimeout(msgT);msgT=setTimeout(()=>m.textContent='',3500)}
function syncMusic(){audio.mode(heat?'heat':'calm')}
const freezeCharges=()=>freeze.filter(t=>t<=Date.now()).length;
function freezeLabel(){
  const c=freezeCharges();if(c>0)return 'FREEZE ×'+c;
  const w=Math.min(...freeze)-Date.now(),m=Math.max(0,Math.ceil(w/1000));
  return 'FREEZE '+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
function canFreeze(){return run&&!busy&&freezeCharges()>0&&(ovN>0||po>BASE)}
function update(){
  const p=effPo(),r=R();
  $('pts').textContent=num(pts);$('pot').textContent=num(pot);
  $('hint').textContent=!run?'':ovN===0?'NEXT OVERHEAT −'+Math.round(r.first*100)+'% OF STAKE':ovN===1?'NEXT OVERHEAT −'+Math.round(r.second*100)+'% OF POT':'';
  $('oN').textContent=Math.round((1-p)*100)+'%';$('oO').textContent=Math.round(p*100)+'%';
  $('go').disabled=busy||!walletReady||(!run&&!stakeOk());
  $('cash').style.visibility=run?'visible':'hidden';$('cash').textContent='CASH OUT '+num(pot);$('cash').disabled=busy||!run;
  $('fix').textContent=freezeLabel();$('fix').disabled=!canFreeze();
  $('stMinus').disabled=busy||run||stakePct<=10;$('stPlus').disabled=busy||run||stakePct>=100;$('stPct').textContent=stakePct+'%';$('stAmt').textContent=num(run?stake0:getStake());$('stake').style.opacity=(busy||run)?.5:1;
  if(typeof renderMarket==='function')renderMarket();
  if(activeTab==='coll'&&typeof renderColl==='function')try{renderColl()}catch(e){}
  if(typeof scheduleSave==='function')scheduleSave();
}
setInterval(()=>{$('fix').textContent=freezeLabel();$('fix').disabled=!canFreeze()},1000);
$('stMinus').onclick=()=>{stakePct=Math.max(10,stakePct-10);update()};$('stPlus').onclick=()=>{stakePct=Math.min(100,stakePct+10);update()};
function soundIcon(){
  $('snd').innerHTML=audio.isMuted()
   ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
   :'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
}
$('snd').onclick=()=>{audio.init();audio.toggle();soundIcon()};soundIcon();

/* ----- round ----- */
function resetRun(){run=false;pot=0;ovN=0;po=BASE;stake0=0;heat=false}   // after a loss, accident or cash-out the reactor is brand new
function start(){
  if(busy)return;audio.init();
  if(!run){
    if(!stakeOk())return;
    const s=getStake();pts=fix(pts-s);pot=s;stake0=s;run=true;ovN=0;
  }
  busy=true;
  showCenter('','•••',accent());update();
  const p=effPo(),out=Math.random()<1-p?'normal':'overheat';
  const from=out==='normal'?0:1-p,size=out==='normal'?1-p:p;
  const target=(from+size*(0.1+0.8*Math.random()))*360;
  const cur=((rot%360)+360)%360,delta=(target-cur+360)%360;
  const dur=[1.5,3,4.5,6][Math.floor(Math.random()*4)],turns=2+Math.round(dur/1.5)+Math.floor(Math.random()*2);   // spin lasts 1.5 / 3 / 4.5 / 6 s, 25% each; longer spin = more turns
  const nd=$('needle');nd.style.transition=`transform ${dur.toFixed(2)}s cubic-bezier(.12,.75,.12,1)`;
  rot+=360*turns+delta;nd.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>finish(out),Math.round(dur*1000)+100);
}
function flashBad(){
  $('app').classList.add('bad');$('pts').classList.add('loss');
  setTimeout(()=>{$('app').classList.remove('bad');$('pts').classList.remove('loss')},1400);
}
function finish(out){
  const r=R();
  if(out==='normal'){
    const g=fix(pot*r.gain);pot=fix(pot+g);
    po=fix(Math.min(PO_MAX,po+STEP));
    heat=false;
    showCenter('NORMAL','+'+num(g),accent());audio.normal();syncMusic();update();
    pending=setTimeout(settle,1700);
    return;
  }
  ovN++;heat=true;
  if(ovN>=r.acc){
    // the last overheat is shown as an overheat first, then immediately as an accident that destroys everything
    const all=pot;
    showCenter('OVERHEAT','•••',AMBER);audio.warn();syncMusic();update();
    setTimeout(()=>{
      pot=0;heat=false;
      showCenter('ACCIDENT','−'+num(all),RED,'EVERYTHING LOST');
      flashBad();audio.horn();syncMusic();update();
      pending=setTimeout(settle,2800);
    },900);
    return;
  }
  const pct=ovN===1?r.first:r.second;
  const lost=fix(Math.min(pot,ovN===1?stake0*r.first:pot*r.second));pot=fix(pot-lost);
  po=BASE;
  showCenter('OVERHEAT','−'+num(lost),AMBER,'−'+Math.round(pct*100)+'% '+(ovN===1?'OF STAKE':'OF POT'));
  audio.warn();syncMusic();update();
  pending=setTimeout(settle,1700);
}
function settle(){
  pending=null;resetNeedle();busy=false;
  if(pot<0.01)resetRun();
  drawRing();syncMusic();update();
}
function cashOut(){
  if(!run||busy)return;
  const v=pot;pts=fix(pts+v);resetRun();
  showCenter('CASH OUT','+'+num(v),accent());audio.cash();drawRing();syncMusic();update();
}
function doFreeze(){
  if(!canFreeze())return;
  const i=freeze.findIndex(t=>t<=Date.now());freeze[i]=Date.now()+FREEZE_MS;
  ovN=0;po=BASE;heat=false;
  audio.freeze();showCenter('FREEZE','RESET',accent(),'OVERHEATS CLEARED');say('FROZEN: 3 OVERHEATS AVAILABLE AGAIN');
  drawRing();syncMusic();update();
}

$('go').onclick=start;$('cash').onclick=cashOut;$('fix').onclick=doFreeze;

/* ----- tiny 3D engine: every item is a real 3D model (lime / black only) ----- */
const V3=(()=>{
  function Mesh(){
    const V=[],F=[];
    const face=(pts,k,ref,n)=>{F.push({v:pts.map(p=>(V.push(p),V.length-1)),k,ref,n})};
    const box=(cx,cy,cz,sx,sy,sz,k)=>{
      const x0=cx-sx/2,x1=cx+sx/2,y0=cy-sy/2,y1=cy+sy/2,z0=cz-sz/2,z1=cz+sz/2,r=[cx,cy,cz];
      face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],k,r);face([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],k,r);
      face([[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],k,r);face([[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],k,r);
      face([[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],k,r);face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],k,r);
    };
    // frustum/cylinder; axis 'x'|'y'|'z'; sc scales the cross-section
    const cyl=(c,r0,r1,h,N,k,axis='y',sc=[1,1])=>{
      const P=(a,t,r)=>{const u=Math.cos(a)*r*sc[0],w=Math.sin(a)*r*sc[1];
        return axis==='y'?[c[0]+u,c[1]+t,c[2]+w]:axis==='x'?[c[0]+t,c[1]+u,c[2]+w]:[c[0]+u,c[1]+w,c[2]+t]};
      const lo=[],hi=[];
      for(let i=0;i<N;i++){const a=i/N*2*Math.PI;lo.push(P(a,-h/2,r0));hi.push(P(a,h/2,r1))}
      for(let i=0;i<N;i++){const j=(i+1)%N;face([lo[i],lo[j],hi[j],hi[i]],k,c)}
      face(lo.slice(),k,c);face(hi.slice(),k,c);
    };
    const sphere=(c,r,nu,nv,k,sc=[1,1,1])=>{
      const P=(i,j)=>{const a=i/nu*2*Math.PI,b=-Math.PI/2+j/nv*Math.PI;return[c[0]+Math.cos(b)*Math.cos(a)*r*sc[0],c[1]+Math.sin(b)*r*sc[1],c[2]+Math.cos(b)*Math.sin(a)*r*sc[2]]};
      for(let i=0;i<nu;i++)for(let j=0;j<nv;j++)face([P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)],k,c);
    };
    const loft=(rings,k,closeEnds=true)=>{
      const n=rings[0].length;
      for(let s=0;s<rings.length-1;s++){const a=rings[s],b=rings[s+1];
        const ref=[0,1,2].map(q=>(a.reduce((t,p)=>t+p[q],0)+b.reduce((t,p)=>t+p[q],0))/(2*n));
        for(let j=0;j<n;j++){const j2=(j+1)%n;face([a[j],a[j2],b[j2],b[j]],k,ref)}}
      if(closeEnds){[rings[0],rings[rings.length-1]].forEach(r=>{const ref=[0,1,2].map(q=>r.reduce((t,p)=>t+p[q],0)/n);face(r.slice(),k,ref)})}
    };
    const extrude=(poly,z0,z1,k)=>{
      let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p[0]*q[1]-q[0]*p[1]}
      const P=a<0?poly.slice().reverse():poly;
      for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length],dx=q[0]-p[0],dy=q[1]-p[1],m=Math.hypot(dx,dy)||1;
        face([[p[0],p[1],z1],[q[0],q[1],z1],[q[0],q[1],z0],[p[0],p[1],z0]],k,null,[dy/m,-dx/m,0])}
      face(P.map(p=>[p[0],p[1],z1]),k,null,[0,0,1]);face(P.map(p=>[p[0],p[1],z0]).reverse(),k,null,[0,0,-1]);
    };
    const done=()=>{

      let rad=0;V.forEach(p=>rad=Math.max(rad,Math.hypot(p[0],p[2])));

          f.n=n;

  const models={};

        case'tire':col='rgb(8,11,7)';stroke='rgba(60,80,20,.5)';break;
        case'dark':col=`rgb(${8+b*14|0},${11+b*20|0},${7+b*8|0})`;stroke=`rgba(${lime[0]},${lime[1]},${lime[2]},.3)`;break;
        default:col='rgb(4,6,4)';stroke='rgb(3,4,3)';
      }
      g.beginPath();f.v.forEach((i,q)=>{const p=T[i],x=cx+p[0]*S,y=cy-p[1]*S;q?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();
      g.fillStyle=col;g.fill();g.strokeStyle=stroke;g.lineWidth=1;g.stroke();
    });
  }
  function loop(){
    requestAnimationFrame(loop);
    for(let i=views.length-1;i>=0;i--){
      const v=views[i];
      if(!v.cv.isConnected){views.splice(i,1);continue}
      if(v.when&&!v.when())continue;
      if(!v.drag)v.ang+=v.speed;
      draw(v);
    }
  }
  function add(cv,id,o={}){
    const v={cv,id,ang:o.ang??-.75,speed:o.speed??.008,bg:o.bg===undefined?'#030403':o.bg,when:o.when,drag:false};
    if(o.drag){
      let lx=0;
      cv.addEventListener('pointerdown',e=>{v.drag=true;lx=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
      cv.addEventListener('pointermove',e=>{if(v.drag){v.ang+=(e.clientX-lx)*.012;lx=e.clientX}});
      ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>v.drag=false));
    }
    views.push(v);if(!running){running=true;loop()}
    return v;
  }
  return{add,models};
})();

/* ================= SHARED BACKEND =================
   Published page: the artifact "db" capability (real players share one market, profiles and ranks).
   Plain file: a local database on this device (only you in it). */
function makeLocalDB(){
  let S={};try{S=JSON.parse(localStorage.getItem('reactor_db')||'{}')}catch(e){}
  const subs=new Set(),leases={},rid=()=>Math.random().toString(36).slice(2,10);
  const persist=()=>{try{localStorage.setItem('reactor_db',JSON.stringify(S))}catch(e){}};
  const par=p=>p.slice(0,p.lastIndexOf('/'));
  const dsnap=p=>({id:p.split('/').pop(),exists:p in S,data:()=>p in S?JSON.parse(JSON.stringify(S[p])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  const touch=()=>{persist();setTimeout(()=>subs.forEach(fn=>fn()),0)};
  const mkSnap=(c,flt)=>{const docs=Object.keys(S).filter(k=>par(k)===c&&flt.every(([f,v])=>S[k][f]===v)).map(dsnap);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}};
  function docRef(p){return{id:p.split('/').pop(),path:p,
    get:async()=>dsnap(p),
    set:async d=>{S[p]=JSON.parse(JSON.stringify(d));touch()},
    update:async d=>{if(!(p in S))throw{code:'invalid_argument'};Object.assign(S[p],d);touch()},
    delete:async()=>{delete S[p];touch()},
    acquire:async o=>{const now=Date.now();if((leases[p]||0)>now&&leases[p+'#h']!==o.holder)return{acquired:false};leases[p]=now+(o.ttlMs||30000);leases[p+'#h']=o.holder;return{acquired:true,holder:o.holder}},
    onSnapshot(next){const fn=()=>next(dsnap(p));subs.add(fn);setTimeout(fn,0);return()=>subs.delete(fn)},
    collection:c=>colRef(p+'/'+c)}}
  function colRef(c,flt=[]){const q={path:c,
    where:(f,op,v)=>colRef(c,flt.concat([[f,v]])),orderBy:()=>q,limit:()=>q,
    get:async()=>mkSnap(c,flt),
    onSnapshot(next){const fn=()=>next(mkSnap(c,flt));subs.add(fn);setTimeout(fn,0);return()=>subs.delete(fn)},
    doc:id=>docRef(c+'/'+(id||rid())),
    add:async d=>{const r=docRef(c+'/'+rid());await r.set(d);return r}};return q}
  return{doc:docRef,collection:p=>colRef(p)};
}

async function buySupply(id){
  const it=ITEM[id],ref=mk.db.doc('supply/'+id);
  if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get(),left=s.exists?Number(s.data().left):it.edition;
  if(!(left>=1))return mnote('SOLD OUT',true);
  if(pts<it.price)return mnote('NOT ENOUGH POINTS',true);
  await ref.set({left:left-1});
  pts=fix(pts-it.price);inv[id]++;update();mnote('BOUGHT '+it.name.toUpperCase());
}
async function buyAsk(id){
  const ref=mk.db.doc('asks/'+id);
  if(!await lease(ref))return mnote('MARKET BUSY, TRY AGAIN',true);
  const s=await ref.get();if(!s.exists)return mnote('ALREADY SOLD',true);
  const a=s.data();if(!ITEM[a.item]||a.seller===mk.uid)return;

  await ref.delete();
  pts=fix(pts-a.price);inv[a.item]++;update();
  await mk.db.collection('mail').add({to:a.seller,kind:'sale',item:a.item,points:a.price,t:Date.now()});

  const rows=ITEMS.filter(it=>(o&&o[it.id])>0).map(it=>`<div class="coll"><div class="th">${it.thumb}</div><b>${esc(it.name)}</b><span>×${o[it.id]} · ${num(o[it.id]*it.price)}</span></div>`);
  return rows.length?rows.join(''):'<div class="empty">NOTHING COLLECTED YET</div>';
};
let myCollSig='';
function renderColl(){
  if(UI.hold){UI.dirty.add('coll');return}
  const el=$('collBody');if(!el)return;
  const ru=LANG==='ru';
  const o=ownedAll(),own=ITEMS.filter(it=>(o[it.id]||0)>0).sort((a,b)=>b.price-a.price);
  const sig=LANG+'|'+themeId+'|'+own.map(i=>i.id+o[i.id]).join();
  if(sig===myCollSig&&el.firstChild)return;
  myCollSig=sig;
  const head=`<div class="tt" style="margin-bottom:10px">${ru?'СТОИМОСТЬ КОЛЛЕКЦИИ':'COLLECTION VALUE'} <b style="color:var(--lime)">${num(collValue(o))}</b></div>`;
  el.innerHTML=own.length
    ?head+`<div class="room">${own.map(it=>`<div class="rm-c"><div class="rm-a"><canvas data-item="${it.id}"></canvas></div><div class="n">${esc(it.name.toUpperCase())}</div><div class="v">×${o[it.id]} · ${num(o[it.id]*it.price)}</div></div>`).join('')}</div>`
    :head+`<div class="empty">${ru?'ПОКА НИЧЕГО НЕ СОБРАНО':'NOTHING COLLECTED YET'}</div><button class="go" id="myShop" style="width:100%;margin-top:10px">${ru?'В РЫНОК':'TO THE MARKET'}</button>`;
  el.querySelectorAll('canvas').forEach(c=>V3.add(c,c.dataset.item,{bg:null,speed:.012}));
}
$('collBody').addEventListener('click',e=>{if(e.target.closest('#myShop'))setTab('market')});
function renderTop(){
  if(UI.hold){UI.dirty.add('top');return}
  if(!$('topBody'))return;
  const val=p=>Number.isFinite(p.value)?p.value:collValue(p.inv);
  const cnt=(p,k)=>Math.max(0,Number(p.inv&&p.inv[k])||0);
  const list=players.filter(p=>p.name).slice().sort((a,b)=>val(b)-val(a));
  const shown=list.slice(0,50);
  let h=shown.map((p,i)=>`<div class="lr${p.id===mk.uid?' me':''}" data-uid="${esc(p.id)}"><span class="rk">#${i+1}</span>${avatar(p.icon)}<span class="nmz">${esc(p.name)}</span><span class="it">${ITEMS.map(it=>'×'+cnt(p,it.id)).join(' ')}</span><span class="vl">${num(val(p))}</span></div>`).join('');
  if(!shown.length)h='<div class="empty">NO PLAYERS YET</div>';
  $('topBody').innerHTML=h;
  $('topInfo').textContent='TOP '+shown.length+' OF '+list.length;
}
$('topBody').addEventListener('click',e=>{

});
function showPlayer(id){

  $('pop').innerHTML=`<div class="pfhead">${avatar(p.icon,true)}<div style="flex:1"><div class="nm">${esc(p.name)}</div><div class="live">COLLECTION VALUE <b style="color:var(--lime)">${num(val)}</b></div></div><button class="sb" id="popX">CLOSE</button></div><div class="mh">COLLECTION</div>${collHTML(p.inv)}`;

let themeOwned=['classic'],themeId='classic';
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];themeId=t.id;
  for(const k in t.v)document.documentElement.style.setProperty(k,t.v[k]);
  LIME=t.v['--lime'];AMBER=t.v['--amber'];RINGBG=t.ring;
  try{localStorage.setItem('reactor_theme',t.id)}catch(e){}
  try{drawRing();update();renderThemes()}catch(e){}
}
function renderThemes(){
  const el=$('pfThemes');if(!el)return;const ru=LANG==='ru';
  el.innerHTML=THEMES.map(t=>{
    const own=themeOwned.includes(t.id),on=themeId===t.id;
    const lab=on?(ru?'ВЫБРАНА':'ACTIVE'):own?(ru?'ВЫБРАТЬ':'SELECT'):(ru?'КУПИТЬ ':'BUY ')+num(t.price);
    return `<div class="thm${on?' on':''}"><i class="sw" style="background:${t.v['--lime']};box-shadow:0 0 10px ${t.v['--lime']}"></i><span class="tn">${ru?t.ru:t.en}</span><button data-th="${t.id}">${lab}</button></div>`}).join('');
}
$('pfThemes').addEventListener('click',e=>{

  const t=THEMES.find(x=>x.id===b.dataset.th),ru=LANG==='ru',m=$('thMsg');
  if(!themeOwned.includes(t.id)){
    if(pts<t.price){m.textContent=ru?'НЕ ХВАТАЕТ ЭНЕРГИИ':'NOT ENOUGH ENERGY';return}
    pts=fix(pts-t.price);themeOwned.push(t.id);m.textContent='';
  }
  applyTheme(t.id);scheduleSave();
});

/* ----- auto-update: on every start check the server for a newer build and reload once ----- */
const BUILD='20261105214617';
(async function(){
  if(!/^https?:/.test(location.protocol))return;
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const t=await r.text(),m=/const BUILD='(\d+)'/.exec(t);
    if(m&&m[1]!==BUILD&&Number(m[1])>Number(BUILD)){
      if(sessionStorage.getItem('reactor_upd')===m[1])return;      // already tried this build in this session, avoid a loop
      sessionStorage.setItem('reactor_upd',m[1]);
      location.replace(location.pathname+'?v='+m[1]+location.hash);
    }
  }catch(e){}
})();

/* ----- do not re-draw the lists while a finger is on them: a re-draw between touch-down and touch-up swallows the tap and breaks scrolling ----- */
const UI={hold:0,dirty:new Set(),t:0};
(function(){
  const rel=()=>{clearTimeout(UI.t);UI.t=setTimeout(()=>{UI.hold=0;const d=[...UI.dirty];UI.dirty.clear();
    d.forEach(k=>{try{if(k==='market')renderMarket();else if(k==='coll')renderColl();else if(k==='top')renderTop()}catch(e){}})},350)};
  const inList=e=>e.target&&e.target.closest&&e.target.closest('.mkbody');
  document.addEventListener('pointerdown',e=>{if(inList(e)){UI.hold=1;clearTimeout(UI.t)}},true);
  ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(UI.hold)rel()},true));
  document.addEventListener('scroll',e=>{if(inList(e)){UI.hold=1;rel()}},true);
})();

async function deleteAccount(){
  const ru=LANG==='ru';
  const o=overlay(`<h2>${ru?'УДАЛИТЬ АККАУНТ?':'DELETE ACCOUNT?'}</h2><div class="tt">${ru?'Все ваши очки, предметы, предложения и запросы будут стёрты навсегда. При следующем входе вы получите новый аккаунт и начнёте с нуля.':'All your points, items, offers and requests will be erased forever. Next time you enter, you get a new account and start from zero.'}</div><div class="tbtns"><button class="ok" id="daNo">${ru?'ОТМЕНА':'CANCEL'}</button><button class="go" id="daYes" style="background:#ff4d3a">${ru?'УДАЛИТЬ':'DELETE'}</button></div>`);
  o.style.zIndex=1100;
  o.querySelector('#daNo').onclick=()=>o.remove();
  o.querySelector('#daYes').onclick=async()=>{
    o.querySelector('#daYes').disabled=true;
    try{
      if(mk.db&&mk.live){
        const uid=mk.uid;
        for(const a of asks.filter(x=>x.seller===uid))try{await mk.db.doc('asks/'+a.id).delete()}catch(e){}
        for(const b of bids.filter(x=>x.buyer===uid))try{await mk.db.doc('bids/'+b.id).delete()}catch(e){}
        // mark as deleted first (works under any rules), then try to remove the rows completely
        try{await mk.db.doc('players/'+uid).set({deleted:true,name:'',icon:0,inv:{},value:0,t:Date.now()})}catch(e){}
        try{await mk.db.doc('data/users/'+uid+'/wallet').set({pts:0,inv:{},freeze:[0,0],codeUsed:[]})}catch(e){}
        try{await mk.db.doc('players/'+uid).delete()}catch(e){}
        try{await mk.db.doc('data/users/'+uid+'/wallet').delete()}catch(e){}
        if(mk.db.signOut)await mk.db.signOut();
      }
    }catch(e){}
    try{const keep=localStorage.getItem('reactor_owner');Object.keys(localStorage).filter(k=>k.startsWith('reactor_')||k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k));if(keep)localStorage.setItem('reactor_owner',keep)}catch(e){}
    location.replace(location.pathname);
  };
}

/* ----- connect ----- */
async function connect(){
  let db=null,uid=null,live=false,ro=false,owner=true;
  try{
    if(window.supabase&&typeof SUPA_URL!=='undefined'){
      const r=await Promise.race([makeSupaDB(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);
      db=r.db;uid=r.uid;live=true;owner=isOwnerDevice();
    }
  }catch(e){console.warn('supabase unavailable',e);window.__connErr=String((e&&(e.message||e.code))||e);db=null}
  try{
    if(!db&&typeof claude!=='undefined'&&claude&&claude.use){
      const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(d&&u){const id=await u.id();if(id){db=d;uid=String(id);live=true;try{ro=(await u.can('data.write'))===false}catch(e){}try{owner=await u.isOwner()}catch(e){owner=false}}}
    }
  }catch(e){}
  if(!db){db=makeLocalDB();uid='me';owner=true}
  mk={db,uid,live,ro,ready:false,owner};
  $('live').textContent=(live?(ro?'LIVE · READ-ONLY':'LIVE · SHARED MARKET'):'OFFLINE · THIS DEVICE ONLY'+(window.__connErr?' · '+window.__connErr.slice(0,70):(window.supabase?'':' · LIBRARY NOT LOADED')));
  try{const p=await db.doc('players/'+uid).get();if(p.exists){const d=p.data();if(d&&d.name)profile={name:String(d.name),icon:Number(d.icon)||0}}}catch(e){}
  try{
    const w=await db.doc('data/users/'+uid+'/wallet').get();
    if(w.exists){const d=w.data();
      if(Number.isFinite(d.pts)&&d.pts>=0)pts=d.pts;
      if(d.inv)ITEMS.forEach(it=>inv[it.id]=Math.max(0,Math.floor(Number(d.inv[it.id])||0)));
      if(Array.isArray(d.freeze))freeze=[Number(d.freeze[0])||0,Number(d.freeze[1])||0];
      if(Array.isArray(d.codeUsed))codeUsed=d.codeUsed.filter(k=>typeof k==='string').slice(-10);
      if(Array.isArray(d.themes))themeOwned=['classic',...d.themes.filter(k=>THEMES.some(t=>t.id===k&&k!=='classic'))];
      if(typeof d.theme==='string'&&themeOwned.includes(d.theme))applyTheme(d.theme);else if(!themeOwned.includes(themeId))applyTheme('classic')}
  }catch(e){}
  lastSaved=JSON.stringify({pts,inv,freeze,codeUsed,themeOwned,themeId});
  const err=()=>{};
  db.collection('asks').onSnapshot(s=>{asks=s.docs.map(d=>({id:d.id,...d.data()}));renderMarket()},err);
  db.collection('bids').onSnapshot(s=>{bids=s.docs.map(d=>({id:d.id,...d.data()}));renderMarket()},err);
  db.collection('supply').onSnapshot(s=>{supply={};s.docs.forEach(d=>{supply[d.id]=Number(d.data().left)});renderMarket()},err);
  db.collection('players').onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.deleted);renderTop();renderMarket()},err);
  db.collection('mail').where('to','==',uid).onSnapshot(s=>s.docs.forEach(processMail),err);
  mk.ready=true;
}

    hand=document.createElement('div');hand.className='chh';
    hand.innerHTML='<i></i><svg width="34" height="34" viewBox="0 0 24 24" fill="#050705" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 114 0v6m0 0V9a2 2 0 114 0v2m0 0a2 2 0 114 0v4a6 6 0 01-6 6h-2a6 6 0 01-5-3l-3-5a2 2 0 013-2l2 2"/></svg>';
    ov.appendChild(hand);
    const T=4200,t0=performance.now();
    const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

      const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2*.84;

  if(/[?&]intro\b/.test(location.search))seen=false;
  else if(!seen&&existing){seen=true;try{localStorage.setItem('reactor_tut','1')}catch(e){}}
  if(!seen)await tutorial();
}
$('help').onclick=()=>{if(!document.querySelector('.ovl,.coach'))tutorial()};

/* ----- splash: "BE CAREFUL" glitches in, riser, glitches out, riser is cut, game opens ----- */
async function splash(){
  const gl=$('gl'),tap=$('tap');const GL={add(c){gl.classList.add(c)},rm(c){gl.classList.remove(c)}};
  audio.init();
  if(!window.__gest){
    tap.style.display='block';
    await new Promise(r=>{const go=()=>{document.removeEventListener('pointerdown',go);document.removeEventListener('keydown',go);r()};document.addEventListener('pointerdown',go);document.addEventListener('keydown',go)});
    audio.init();await sleep(120);
  }
  tap.style.display='none';

  audio.riser(3.3);
  await sleep(250);
  GL.add('in');audio.glitch();
  await sleep(800);GL.rm('in');GL.add('on');
  await sleep(1300);
  GL.rm('on');GL.add('out');audio.glitch();
  await sleep(800);
  audio.riserCut();$('splash').remove();
}
function fitNow(){const app=$('app');app.style.zoom=1;const pad=14,z=Math.min(1,(innerWidth-pad*2)/app.offsetWidth,(innerHeight-pad*2)/app.offsetHeight);app.style.zoom=z;document.documentElement.style.setProperty('--z',z)}
function pickLang(){return new Promise(res=>{
  const o=overlay('<h2>LANGUAGE · ЯЗЫК</h2><button class="go" id="lRu">РУССКИЙ</button><button class="go" id="lEn">ENGLISH</button>');
  o.style.zIndex=1100;
  const set=l=>{LANG=l;try{localStorage.setItem('reactor_lang',l)}catch(e){}audio.init();window.__gest=true;document.documentElement.lang=l;if(l==='ru')trNode(document.body);o.remove();res()};
  o.querySelector('#lRu').onclick=()=>set('ru');o.querySelector('#lEn').onclick=()=>set('en');
})}
async function boot(){
  const conn=connect();
  if(!LANG)await pickLang();
  await splash();
  await conn;
  const existing=!!profile;
  if(!profile)profile={name:'PLAYER-'+Math.random().toString(36).slice(2,6).toUpperCase(),icon:Math.floor(Math.random()*ICONS.length)};
  walletReady=true;
  document.body.classList.remove('boot');
  audio.musicGate(true);
  drawRing();update();fitNow();renderTop();renderProfile();
  publishProfile();
  setTimeout(()=>maybeTutorial(existing),500);
}
addEventListener('resize',()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;fitNow()});   // the on-screen keyboard shrinks the window: do not re-scale the interface because of it
drawRing();update();
boot();
</script></body></html>
